# Windows kurulum dosyası (.exe) üretir.
# Kullanım: GitHub > Actions > "Build Windows" > Run workflow
# Bittiğinde sayfanın altındaki "Artifacts" bölümünden Kasa-Setup.zip indirilir.
name: Build Windows

on:
  workflow_dispatch:      # elle başlat
  push:
    tags: ['v*']          # v1.0.0 gibi bir etiket atınca da derler

jobs:
  windows:
    # windows-latest artık Visual Studio 18 taşıyor; better-sqlite3'ün kullandığı
    # node-gyp 9 bu sürümü tanımıyor ("could not find a version of Visual Studio
    # 2017 or newer"). windows-2022 imajında VS2022 var ve node-gyp onu buluyor.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # better-sqlite3 13 ve electron 44 Node 22 istiyor.
          node-version: 22

      # node-gyp 9, Python'un distutils modülünü kullanıyor. Bu modül Python
      # 3.12'de TAMAMEN KALDIRILDI ve derleme "ModuleNotFoundError: No module
      # named 'distutils'" ile patlıyor. Runner'ın varsayılanı 3.12 olduğu için
      # Python'u distutils'in hâlâ bulunduğu 3.11'e sabitliyoruz.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: npm install

      - name: Testleri çalıştır (gerçek Windows üzerinde)
        run: npm test

      - name: Native modülleri Electron için derle
        run: npx electron-builder install-app-deps

      - name: Windows kurulum dosyasını üret
        run: npx electron-builder --win --x64 --publish never

      - name: Çıktıyı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Kasa-Setup
          path: |
            dist_build/*.exe
            dist_build/*.blockmap
          if-no-files-found: error
