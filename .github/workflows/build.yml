# Windows kurulum dosyası (.exe) üretir.
# Kullanım: GitHub > Actions > "Build Windows" > Run workflow
# Bittiğinde işin sayfasındaki "Artifacts" bölümünden Kasa-Setup indirilir.
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    # windows-latest artık Visual Studio 18 ile geliyor ve node-gyp onu tanımıyor
    # ("could not find a version of Visual Studio 2017 or newer").
    # windows-2022 imajında VS 2022 var; better-sqlite3 burada sorunsuz derleniyor.
    runs-on: windows-2022

    env:
      # node-gyp'a hangi Visual Studio'yu kullanacağını söyler.
      # (npm config ile değil, ortam değişkeniyle verilir — npm 10 bunu
      # geçersiz bir npm seçeneği sayıp hata veriyor.)
      GYP_MSVS_VERSION: '2022'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları kur
        run: npm install

      - name: Testleri çalıştır (gerçek Windows üzerinde)
        run: npm test

      - name: Native modülleri Electron için derle
        run: npx electron-builder install-app-deps

      - name: Windows kurulum dosyasını üret
        run: npx electron-builder --win --x64 --publish never

      - name: Çıktıyı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Kasa-Setup
          path: |
            dist_build/*.exe
            dist_build/*.blockmap
          if-no-files-found: error
