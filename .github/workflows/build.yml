# Windows kurulum dosyası (.exe) üretir.
# Kullanım: GitHub > Actions > "Build Windows" > Run workflow
# Bittiğinde sayfanın altındaki "Artifacts" bölümünden Kasa-Setup.zip indirilir.
name: Build Windows

on:
  workflow_dispatch:      # elle başlat
  push:
    tags: ['v*']          # v1.0.0 gibi bir etiket atınca da derler

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # better-sqlite3 13 ve electron 44 Node 22 istiyor.
          node-version: 22

      # ── KRİTİK ADIM ──────────────────────────────────────────────
      # better-sqlite3 native bir modül; hazır ikili bulunamazsa node-gyp ile
      # derleniyor. Runner'daki Visual Studio 18'i node-gyp 9 TANIMIYOR
      # ("could not find a version of Visual Studio 2017 or newer") ve
      # msvs_version ayarı da bunu çözmüyor — log'da "VCINSTALLDIR not set"
      # satırı bunu söylüyor. Bu adım derleyici ortam değişkenlerini kurar;
      # node-gyp o zaman sürüm arama aşamasını atlayıp hazır ortamı kullanır.
      - name: MSVC derleyici ortamını kur
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Bağımlılıkları kur
        run: npm install

      - name: Testleri çalıştır (gerçek Windows üzerinde)
        run: npm test

      - name: Native modülleri Electron için derle
        run: npx electron-builder install-app-deps

      - name: Windows kurulum dosyasını üret
        run: npx electron-builder --win --x64 --publish never

      - name: Çıktıyı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Kasa-Setup
          path: |
            dist_build/*.exe
            dist_build/*.blockmap
          if-no-files-found: error
