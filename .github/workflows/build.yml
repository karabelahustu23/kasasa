# Windows kurulum dosyası (.exe) üretir.
# Kullanım: GitHub > Actions > "Build Windows" > Run workflow
# Bittiğinde işin sayfasındaki "Artifacts" bölümünden Kasa-Setup indirilir.
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    # windows-latest artık Visual Studio 18 ile geliyor ve node-gyp onu tanımıyor.
    # windows-2022 imajında VS 2022 var; better-sqlite3 burada derlenebiliyor.
    runs-on: windows-2022

    env:
      GYP_MSVS_VERSION: '2022'   # node-gyp'a hangi VS'i kullanacağını söyler

    steps:
      - uses: actions/checkout@v4

      # better-sqlite3@13 ve electron@44 Node 22 istiyor; Node 20'de uyarı
      # verip eski node-gyp'a düşüyordu.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # KRİTİK: Python 3.12'de 'distutils' kaldırıldı, node-gyp'ın kullandığı gyp
      # betiği hâlâ onu arıyor ("ModuleNotFoundError: No module named 'distutils'").
      # Python 3.11 bu modülü hâlâ içeriyor.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: npm install

      - name: Testleri çalıştır (gerçek Windows üzerinde)
        run: npm test

      - name: Native modülleri Electron için derle
        run: npx electron-builder install-app-deps

      - name: Windows kurulum dosyasını üret
        run: npx electron-builder --win --x64 --publish never

      - name: Çıktıyı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Kasa-Setup
          path: |
            dist_build/*.exe
            dist_build/*.blockmap
          if-no-files-found: error
